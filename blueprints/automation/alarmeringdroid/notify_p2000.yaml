blueprint:
  name: "P2000 message → notification"
  description: >-
    Send a push notification to a phone (Home Assistant Companion app) for every
    new P2000 message found by an AlarmeringDroid search.
  domain: automation
  source_url: https://github.com/OWNER/ha-alarmeringdroid/blob/main/blueprints/automation/alarmeringdroid/notify_p2000.yaml
  input:
    search:
      name: Search
      description: Which AlarmeringDroid search to react to. Leave empty for all searches.
      default: ""
      selector:
        config_entry:
          integration: alarmeringdroid
    notify_device:
      name: Device to notify
      description: The mobile app device that receives the notification.
      selector:
        device:
          filter:
            - integration: mobile_app
    only_prio1:
      name: Only priority 1
      description: >-
        Only notify for priority 1 incidents. Follow-up messages in an incident
        that started as priority 1 are included.
      default: false
      selector:
        boolean:
    include_followups:
      name: Include follow-ups
      description: Also notify for follow-up messages in an existing incident.
      default: true
      selector:
        boolean:

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: alarmeringdroid_message

variables:
  search: !input search
  only_prio1: !input only_prio1
  include_followups: !input include_followups

conditions:
  - condition: template
    value_template: "{{ not search or trigger.event.data.entry_id == search }}"
  - condition: template
    value_template: "{{ not only_prio1 or trigger.event.data.incident_prio1 }}"
  - condition: template
    value_template: "{{ include_followups or not trigger.event.data.is_followup }}"

actions:
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "{{ trigger.event.data.dienst }} – {{ trigger.event.data.plaats }}"
    message: "{{ trigger.event.data.melding }}"
    data:
      url: "{{ trigger.event.data.url }}"
      clickAction: "{{ trigger.event.data.url }}"
